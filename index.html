<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Numi - A Calculator App</title>
  </head>
  <body>
    <div class="container">
      <!-- Container for the entire calculator. -->
      <div class="calculator">
        <div class="display">
          <div class="display-history"></div>
          <div class="display-result">0</div>
        </div>
        <!-- Container for the numbers only. -->
        <div class="number-pad">
          <button type="button" class="action clear" data-value="clear">
            AC
          </button>
          <button type="button" class="action delete" data-value="delete">
            DEL
          </button>
          <button type="button" class="action percent" data-value="percent">
            %
          </button>
          <button type="button" class="operator" data-value="/">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-divide-icon lucide-divide"
            >
              <circle cx="12" cy="6" r="1" />
              <line x1="5" x2="19" y1="12" y2="12" />
              <circle cx="12" cy="18" r="1" />
            </svg>
          </button>
          <button type="button" class="number" data-value="7">7</button>
          <button type="button" class="number" data-value="8">8</button>
          <button type="button" class="number" data-value="9">9</button>
          <button type="button" class="operator" data-value="*">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-x-icon lucide-x"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
          <button type="button" class="number" data-value="4">4</button>
          <button type="button" class="number" data-value="5">5</button>
          <button type="button" class="number" data-value="6">6</button>
          <button type="button" class="operator" data-value="-">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-minus-icon lucide-minus"
            >
              <path d="M5 12h14" />
            </svg>
          </button>
          <button type="button" class="number" data-value="1">1</button>
          <button type="button" class="number" data-value="2">2</button>
          <button type="button" class="number" data-value="3">3</button>
          <button type="button" class="operator" data-value="+">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-plus-icon lucide-plus"
            >
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
          </button>
          <button type="button" class="action negate" data-value="negate">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-diff-icon lucide-diff"
            >
              <path d="M12 3v14" />
              <path d="M5 10h14" />
              <path d="M5 21h14" />
            </svg>
          </button>
          <button type="button" class="number" data-value="0">0</button>
          <button type="button" class="number" data-value=".">.</button>
          <button type="button" class="action equals" data-value="equals">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-equal-icon lucide-equal"
            >
              <line x1="5" x2="19" y1="9" y2="9" />
              <line x1="5" x2="19" y1="15" y2="15" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
